<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RFQ_SKU_GMP</title><style>body{font:16px system-ui;background:#f3f5f8;color:#182534;min-height:100vh;margin:0;display:grid;place-items:center}main{background:white;border-radius:18px;padding:32px;max-width:440px;width:calc(100% - 100px);box-shadow:0 12px 45px #18253418;text-align:center}img{width:140px;height:140px;object-fit:contain;background:white}h1{font-size:23px;line-height:1.4}label{text-align:left;display:grid;gap:8px;margin:18px 0}input,button{font:inherit;padding:12px;border:1px solid #c2cbd6;border-radius:7px}button{background:#173a6b;color:white;width:100%;border:0;cursor:pointer}output{display:block;color:#a02b32;margin-top:18px}p{color:#526275;font-size:14px}body{background:#f5f4ef;color:#292a28;border-top:5px solid #a52e25}main{border:1px solid #dddcd6;border-radius:8px;box-shadow:0 8px 35px #292a280c}h1{font-weight:650;letter-spacing:-.5px}button{background:#284e42;border-radius:5px;font-weight:600}input{border-color:#bdbfb9;border-radius:5px}input:focus{outline:2px solid #527e6f}</style><style id="gmp-login-theme">body{background:radial-gradient(ellipse at 15% 20%,#e7dce9,transparent 48%),radial-gradient(ellipse at 90% 80%,#e7eceb,transparent 50%),#f5f6fa;color:#292536;border:0;font-family:'Segoe UI',system-ui,sans-serif}main{max-width:430px;width:calc(100% - 38px);box-sizing:border-box;padding:34px 38px 30px;border-radius:20px;border:1px solid #e5e1ea;box-shadow:0 15px 60px #4a335d0a}img{width:96px;height:96px;padding:8px;border:1px solid #eeebf1;border-radius:19px}h1{font-size:24px;line-height:1.3;font-weight:650;color:#49384f;letter-spacing:-.6px;margin:22px 0 9px}main>p{font-size:12px;color:#8c8396;margin-bottom:27px}label{font-size:12px;font-weight:600;color:#61556b;gap:8px}input{font-size:14px;background:#faf9fc;border:1px solid #ded9e5;border-radius:8px;min-width:0}input:focus{outline:2px solid #b28aab;outline-offset:1px;background:#fff}button{background:#714b67;color:#fff;border-radius:8px;padding:13px;font-size:13px;margin-top:8px;transition:background .15s}button:hover{background:#5b3a53}button:disabled{opacity:.55}output{font-size:12px;color:#b94450}output:empty{display:none}@media(max-width:450px){main{padding:28px 25px}h1{font-size:23px}}

.gmp-password-visibility{display:flex;align-items:center;gap:9px;margin:8px 0 18px;font-weight:400}.gmp-password-visibility input{width:18px;height:18px;min-height:18px;margin:0;padding:0;accent-color:#714b67}
</style><main><img src="/logo.png" alt="Grupo Mi Pan"><h1>RFQ_SKU_GMP</h1><p id="appLoginInfo">Versión 2.1.0<br>aplicación soportada y gestionada por Ing. Mario González, sistemas@grupomipan.com 2026</p><p>Catálogos, requisiciones y reportes en un solo lugar</p><form id="login"><label>Correo<input id="email" type="email" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" minlength="4" maxlength="200" required></label><label class="gmp-password-visibility"><input id="mostrarPassword" type="checkbox" aria-controls="password"><span>Mostrar contraseña</span></label><button id="entrar">Iniciar sesión</button></form><output id="error" aria-live="polite"></output></main><script>document.getElementById('mostrarPassword').onchange=()=>{document.getElementById('password').type=document.getElementById('mostrarPassword').checked?'text':'password';};document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('entrar');button.disabled=true;try{const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const data=await res.json();if(!res.ok)throw Error(data.error||'No se pudo iniciar sesión.');location.assign('/');}catch(err){document.getElementById('error').textContent=err.message;}finally{button.disabled=false;}};</script></html>
