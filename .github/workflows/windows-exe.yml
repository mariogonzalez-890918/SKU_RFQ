name: Compilar y publicar EXE Windows
on:
  workflow_dispatch:
  push:
    branches: [main, codex/v2-ventasins-expendios]
    paths:
      - 'sku-servidor/**'
      - 'sku/**'
      - 'tools/**'
      - 'requirements*.txt'
      - '.github/workflows/windows-exe.yml'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Probar instalación y respaldos
        run: python tools/test_all.py
      - name: Probar menú de celular y tablet
        run: |
          node tests/mobile_menu_regression.mjs
          node tests/commercial_browser_regression.mjs
      - name: Compilar distribución pública
        run: python tools/build_public.py --output-dir dist-public
      - name: Publicar EXE y ZIP en Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-${{ github.run_number }}-${{ github.run_attempt }}"
          $releaseOptions = @()
          if ("3.1.8" -match "rc|beta|alpha") { $releaseOptions += "--prerelease" }
          gh release create $tag dist-public/GMP_ERP.exe dist-public/RFQ_SKU_GMP.exe dist-public/SKU-JAD-Servidor.exe GMP_ERP_Windows.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "GMP ERP v3.1.8 - Windows $tag" @releaseOptions --notes "EXE para Windows sin Python externo. Catálogos vacíos y contraseña definida en el primer inicio. Para actualizar, conserva data y config.json."

