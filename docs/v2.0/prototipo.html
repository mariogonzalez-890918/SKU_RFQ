function pos(){controls('Expendios / Punto de Venta / EJIDOS · DEMO-01',[button('Volver al dashboard',boxes),button('Ticket de muestra',()=>printPreview('ticket'))]);let total=cart.reduce((s,n,i)=>s+n*items[i][1],0);$('view').innerHTML=(!staff()?'<p class="notice">Modo consulta: el perfil puede ver Expendios, pero no cobrar ni operar caja.</p>':'')+'<div class="pos-tabs"><button id="sideProducts">Catálogo</button><button id="sideCart">Pedido ('+cart.reduce((s,n)=>s+n,0)+')</button></div><section class="pos" data-side="'+posSide+'" id="posPane"><aside class="cart"><h3>Pedido de muestra · Usuario demo</h3><div class="cart-lines">'+items.map((p,i)=>cart[i]?'<div class="cart-line"><span><b>'+p[0]+'</b><br>'+cart[i]+' PIEZA × '+money(p[1])+'</span><div><strong>'+money(cart[i]*p[1])+'</strong><br><button data-remove-cart="'+i+'"'+(!staff()||paidCart?' disabled':'')+'>Eliminar partida</button></div></div>':'').join('')+'</div><div class="cart-total">Total: '+money(total)+'</div><div class="pos-controls"><div class="pos-control-left"><button id="posCustomer">◉ Cliente de ejemplo</button><button class="checkout" id="pay"><span class="pay-arrow">❯</span>Pago</button></div><div class="pad">'+['1','2','3','Cant.','4','5','6','Desc.','7','8','9','Precio','±','0',',','⌫'].map(n=>'<button class="key">'+n+'</button>').join('')+'</div></div></aside><section class="products"><div class="toolbar"><button class="primary" id="allProducts">Todos</button><button id="bread">Pan</button><input id="productSearch" aria-label="Buscar producto" placeholder="Buscar producto / código" style="width:100%"></div><div class="product-grid">'+items.map((p,i)=>'<button class="product" data-item="'+i+'"><span class="illustration" aria-hidden="true">'+p[2]+'</span><span class="text">'+p[0]+'<span class="price">'+money(p[1])+'</span></span></button>').join('')+'</div></section></section>';$('sideProducts').onclick=()=>{posSide='products';$('posPane').dataset.side='products';};$('sideCart').onclick=()=>{posSide='cart';$('posPane').dataset.side='cart';};$('view').querySelectorAll('[data-remove-cart]').forEach(btn=>btn.onclick=()=>{cart[Number(btn.dataset.removeCart)]=0;pos();});$('view').querySelectorAll('[data-item]').forEach(b=>{b.disabled=!staff()||!!paidCart;b.onclick=()=>{cart[Number(b.dataset.item)]++;pos()}});$('productSearch').oninput=()=>{const q=$('productSearch').value.toUpperCase();$('view').querySelectorAll('[data-item]').forEach(b=>b.hidden=!b.textContent.includes(q))};$('allProducts').onclick=()=>{$('productSearch').value='';$('productSearch').dispatchEvent(new Event('input'))};$('bread').onclick=()=>{$('productSearch').value='BOLILLO';$('productSearch').dispatchEvent(new Event('input'))};$('pay').disabled=!staff()||!total||!!paidCart;$('pay').onclick=payment;$('posCustomer').onclick=()=>toast('Se elegiría cliente y una lista autorizada, validada por el servidor.');$('view').querySelectorAll('.key').forEach(b=>b.onclick=()=>toast('Teclado conceptual: la versión funcional validará cantidades y permisos de descuentos.'))}
function payment(){controls('Expendios / Pago de muestra',[button('Volver al pedido',pos)]);const total=cart.reduce((s,n,i)=>s+n*items[i][1],0);$('view').innerHTML='<article class="sheet"><h1>Pago</h1><p class="notice">SIMULACIÓN · No se procesa ni registra dinero.</p><div class="fields"><div><h3>Forma de pago</h3><button class="primary" id="cash">Efectivo</button><p>Solo métodos habilitados para la caja.</p></div><div><h2>Total: '+money(total)+'</h2><label>Recibido <input id="received" type="number" min="0" step="0.01" value="'+(total/100).toFixed(2)+'"></label><p id="change"></p><button class="green" id="validatePayment">Validar · simulación</button></div></div></article>';const update=()=>{$('change').textContent='Cambio de muestra: '+money(Math.max(0,Math.round(Number($('received').value)*100)-total))};$('received').oninput=update;update();$('cash').onclick=()=>toast('Efectivo seleccionado para la simulación.');$('validatePayment').onclick=()=>{if(Math.round(Number($('received').value)*100)<total){toast('El recibido de muestra es menor al total.');return}printPreview('ticket');toast('Ticket de muestra. No existe un cobro real.')}}
function dashboard(){controls(app==='expendios'?'Informes / Ventas y cierres':'Informes / Dashboard',[button('Filtrar período',()=>toast('Propuesta: fecha, sucursal, canal, vendedor/caja y cliente.'))]);$('view').innerHTML='<p class="notice">Demostración de métricas distintas: cotización ≠ pedido ≠ cobro. Período y precios ficticios.</p><section class="cards">'+[['Cotizado vigente','$ 120.00'],['Pedidos confirmados','$ 210.00'],['Cobrado en TPV','$ 34.00'],['Meta de cobro','$ 1,000.00']].map(([t,v])=>'<article class="metric">'+t+'<strong>'+v+'</strong></article>').join('')+'</section><article class="panel" style="margin-top:20px"><h2>Cumplimiento de meta de cobro · 3.4%</h2><div style="height:20px;background:#eee"><div style="height:100%;width:3.4%;background:#00a09d"></div></div><p class="small">Una sola moneda · MXN · Impuestos demo 0%. Los datos no provienen del proyecto.</p>'+table(['Sucursal','Canal','Cobrado','Meta','Detalle'],[['EJIDOS','Expendios','$ 34.00','$ 1,000.00','Ticket de muestra']])+'</article>'}
function generic(){const names={orders:'Pedidos',customers:'Clientes',products:'Productos',prices:'Listas de precios',import:app==='expendios'?'Cargar layout de Expendios':'Importar maestro de productos de venta',templates:'Plantillas de presupuesto',settings:'Configuración',tickets:'Tickets',sessions:'Sesiones',analysis:'Ventas y presupuestos'};controls(names[route]||route,[button('Vista de ejemplo',()=>toast('Sección propuesta para la implementación de v2.0.'))]);if(route==='orders'){form(true);return}if(route==='import'){$('view').innerHTML='<article class="sheet"><h1>'+names[route]+'</h1><p class="notice">Propuesta de carga: descargar plantilla → mapear encabezados → validar → revisar diferencias → confirmar.</p><div class="layout-code">'+(app==='expendios'?'SUCURSAL, CAJA_CLAVE, SKU, CATEGORIA_TPV, ORDEN_CATEGORIA, ORDEN_PRODUCTO, VISIBLE, LISTA_PREDETERMINADA':'SUGERIDO: A SKU · B tipo · C categoría · D subcategoría · E línea pasteles · F módulo · G expendio · H descripción · I público institucional · J ruta · K despacho · N IVA incluido · O UOM · S estatus')+'</div><p>SKU históricos de A intactos. Propuesta: OneDrive cada 12 horas y botón Actualizar manualmente. El prototipo no se conecta ni importa archivos.</p><a href="LAYOUTS.md">Revisar todos los campos y validaciones</a></article>';return}if(route==='prices'){$('view').innerHTML=table(['Lista','Canal','Sucursal','Moneda','Vigencia','Edición'],[['VENTASINS DEMO','VentasIns','EJIDOS','MXN','Ejemplo','Solo administradores autorizados'],['EXPENDIOS EJIDOS DEMO','Expendios','EJIDOS','MXN','Ejemplo','Solo administradores autorizados']]);return}if(route==='products'){$('view').innerHTML=table(['SKU','Descripción','Unidad','Canal','Módulo PDV'],[['PTPB07BOL0000A','BOLILLO DEMO','PIEZA','VentasIns / Expendios','A11'],['PTPB01BAG0000B','BAGEL DEMO','PIEZA','VentasIns / Expendios','A11']]);return}if(route==='customers'){$('view').innerHTML=table(['Cliente','Lista autorizada','Sucursal'],[['Cliente de ejemplo A','VENTASINS DEMO','EJIDOS']]);return}if(route==='tickets'){$('view').innerHTML=table(['Ticket','Caja','Fecha','Importe','Estado'],[['TPV-DEMO-0001','DEMO-01','28/10/2026','$ 34.00','Muestra']]);$('actions').append(button('Ver ticket',()=>printPreview('ticket')));return}if(route==='sessions'){$('view').innerHTML=table(['Sesión','Sucursal / caja','Operador','Estado'],[['SES-DEMO-01','EJIDOS / DEMO-01','Usuario demo','Muestra abierta']]);return}if(route==='analysis'){dashboard();return}if(route==='templates'){$('view').innerHTML=table(['Plantilla','Vigencia','Contenido'],[['Presupuesto estándar GMP','14 días demo','Productos, secciones, notas y condiciones']]);return}$('view').innerHTML='<article class="panel"><h2>'+names[route]+'</h2><p>Ajustes propuestos de sucursal, cajas, series, pagos y formatos. Solo para perfiles autorizados por Sistemas.</p><p>La implementación deberá validar la misma autorización en el servidor.</p></article>'}
function navigate(key){if(app==='expendios'&&!$('allowExp').checked){home();return}route=key;if(key==='quotes')quotes();else if(key==='boxes')boxes();else if(key==='pos')pos();else if(key==='dashboard')dashboard();else generic()}
function printPreview(kind){$('printSize').textContent=kind==='ticket'?'@page{size:80mm 230mm;margin:0}':'@page{size:letter;margin:12mm}';if(kind==='ticket'){const commercial=app==='ventasins',rows=commercial?quoteLines.map(line=>({name:items[line.id][0],qty:line.qty,price:line.price})):items.map((item,i)=>({name:item[0],qty:(paidCart||cart)[i],price:item[1]})).filter(line=>line.qty),total=rows.reduce((sum,line)=>sum+Math.round(line.qty*line.price),0);$('printContent').innerHTML='<article class="ticket"><header><b>GRUPO MI PAN</b><h2>'+(commercial?(quoteOrder?'PEDIDO DE MUESTRA':'PRESUPUESTO DE MUESTRA'):'RECIBO DE MUESTRA')+'</h2>EJIDOS · DEMO-01<br>'+(commercial?(quoteOrder?'PED-DEMO-0001':'PRES-DEMO-0001'):'TPV-DEMO-0001')+'<br>28/10/2026 · Usuario demo</header><p>VISTA CONCEPTUAL · DATOS FICTICIOS'+(commercial&&quoteCancelled?' · CANCELADO':'')+'</p>'+rows.map(line=>'<div class="row"><b>'+line.name+'</b><br>'+line.qty+' PIEZA × '+money(line.price)+'<br><strong>'+money(Math.round(line.qty*line.price))+'</strong></div>').join('')+'<p>Subtotal: '+money(total)+'<br>Impuestos demo: $ 0.00</p><p class="sum">TOTAL '+money(total)+'</p><p>'+(commercial?'Sin cobro registrado.':'Efectivo de muestra: '+money(total)+'<br>Cambio de muestra: $ 0.00')+'</p><p style="text-align:center">Gracias por su visita<br>RFQ_SKU_GMP · Propuesta v2.0</p></article>'}else $('printContent').innerHTML='<article class="paper"><header class="paperhead"><div><b style="font-size:24px;color:#714b67">GRUPO MI PAN</b><p>Empresa y dirección de muestra<br>RFQ_SKU_GMP</p></div><div>Cliente de ejemplo A<br>Domicilio de muestra<br>EJIDOS</div></header><p class="small">VISTA CONCEPTUAL · DATOS FICTICIOS</p><h2>'+(quoteOrder?'Pedido PED-DEMO-0001':'Presupuesto PRES-DEMO-0001')+(quoteCancelled?' · CANCELADO':'')+'</h2><div class="fields"><div><b>Fecha</b><p>28/10/2026</p></div><div><b>Vigencia / Vendedor</b><p>11/11/2026 · Usuario demo</p></div></div>'+table(['Descripción / SKU','Cantidad','Unidad','Precio final','Importe'],quoteLines.map(line=>[items[line.id][0]+'<br>'+demoSkus[line.id],line.qty,'PIEZA',money(line.price),money(Math.round(line.qty*line.price))]))+'<div class="totals"><p>Subtotal <b>'+money(quoteTotal())+'</b></p><p>IVA demo 0% <b>$ 0.00</b></p><p class="grand">Total <b>'+money(quoteTotal())+'</b></p></div><p>Condiciones de ejemplo: contado. Documento conceptual para revisar composición similar a Odoo 14.</p><div class="signature">Aceptación · Nombre y firma</div></article>';$('printDialog').showModal()}
